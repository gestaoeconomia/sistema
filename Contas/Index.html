<script>/* SPLASH.msg(texto) troca a etapa; SPLASH.adiar() devolve uma função "terminei" para telas que carregam dados depois de desenhar;
   SPLASH.telaPronta() avisa que a primeira tela foi desenhada; a tela some quando as duas coisas acontecem. Nunca prende: aviso só quando passa do normal deste aparelho e sai sozinha aos 75 s (V1.4). */
window.SPLASH = (function () {
  var el = document.getElementById('splash'), pend = 0, desenhada = false, foi = false, t1, t2, t0 = Date.now(), mede = true;
  /* V1.4 (do SIG V6.15.1): o aviso de demora usa o tempo normal DESTE aparelho (média das últimas 6 aberturas): aparece só depois de ~2x
     esse tempo (entre 25 e 50 s) — uma abertura com o servidor do Google "frio" já leva de 15 a 40 s com internet boa.
     Sem internet de verdade, avisa na hora (e o aviso some quando a conexão volta). A tela de abertura espera até 75 s. */
  function tempos() { try { var a = JSON.parse(localStorage.getItem('cc_tempos_abertura') || '[]'); return Array.isArray(a) ? a.filter(function (x) { return x > 0 && x < 120000; }) : []; } catch (e) { return []; } }
  function limiar() { var a = tempos(); if (!a.length) return 25000; var m = a.reduce(function (t, x) { return t + x; }, 0) / a.length; return Math.min(50000, Math.max(25000, Math.round(m * 2))); }
  var DEMORA = 'Está demorando mais que o normal. O servidor está preparando os dados — isso pode levar até um minuto.';
  var SEM_NET = 'Sem conexão com a internet. O app continua tentando — verifique o Wi-Fi ou os dados móveis.';
  function aviso(txt) { var d = document.getElementById('splash-dem'); if (!d || foi) return; d.textContent = txt || DEMORA; d.classList.add('vis'); }
  window.addEventListener('offline', function () { aviso(SEM_NET); });
  window.addEventListener('online', function () { var d = document.getElementById('splash-dem'); if (d && d.textContent === SEM_NET) d.classList.remove('vis'); });
  var molde = el ? el.cloneNode(true) : null;   // para reabrir (ex.: retomar a sessão depois que ela expirou com o app aberto)
  function relogios() { clearTimeout(t1); clearTimeout(t2); if (navigator.onLine === false) aviso(SEM_NET); t1 = setTimeout(function () { aviso(navigator.onLine === false ? SEM_NET : DEMORA); }, limiar()); t2 = setTimeout(function () { mede = false; fim(); }, 75000); }
  relogios();
  function fim() { if (foi || !el) return; foi = true; clearTimeout(t1); clearTimeout(t2);
    if (mede) { try { var a = tempos(); a.push(Date.now() - t0); localStorage.setItem('cc_tempos_abertura', JSON.stringify(a.slice(-6))); } catch (e) {} }
    el.classList.add('saindo'); var e = el; setTimeout(function () { if (e && e.parentNode) e.parentNode.removeChild(e); }, 450); }
  function tentar() { if (desenhada && pend <= 0) fim(); }
  return {
    msg: function (t) { var m = document.getElementById('splash-msg'); if (m && !foi) m.textContent = t; },
    adiar: function () { if (foi) return function () {}; pend++; var feito = false; return function () { if (feito) return; feito = true; pend--; tentar(); }; },
    telaPronta: function () { desenhada = true; setTimeout(tentar, 0); },
    ola: function (nome) { var o = document.getElementById('splash-ola'); if (o) o.textContent = nome ? 'Olá, ' + nome + '!' : ''; },
    novaTela: function () { desenhada = false; },
    reabrir: function () { if (!foi || !molde) return; el = molde.cloneNode(true); document.body.appendChild(el); foi = false; pend = 0; desenhada = false; t0 = Date.now(); mede = true; relogios(); },
    naoMedir: function () { mede = false; },   // aberturas que param na tela de entrada não contam como tempo normal
    fim: fim, ativa: function () { return !foi; }
  };
})()</script>
