    el('path', { d: 'M19 31 L32 20 L45 31 V45.5 a1.8 1.8 0 0 1 -1.8 1.8 H20.8 a1.8 1.8 0 0 1 -1.8 -1.8 Z', fill: 'none', stroke: 'url(#' + id + 'c)', 'stroke-width': 4, 'stroke-linejoin': 'round' }),

// ---------- entrar ----------

    campo('E-mail', email), campo('Senha', senha), h('label', { class: 'manter' }, manter, 'Manter-me conectado neste aparelho'), h('div', { style: { height: '12px' } }), btn);

    h('p', { class: 'dica', style: { textAlign: 'center' } }, 'Esqueceu a senha? Peça para a outra pessoa redefinir em “Minha conta”.')));
  // quando as duas contas já existem, troca o botão por um aviso (o cadastro fecha sozinho)
  GET('/api/config', { semRedirecionar: true }).then(cfg => { if (cfg.cadastro_aberto === false) limpar(linkCad).append(h('p', { class: 'dica', style: { margin: 0 } }, 'As duas contas do casal já foram criadas.')); }).catch(() => {});

}
// ---------- criar conta ----------

  const s1 = h('input', { type: 'password', autocomplete: 'new-password', placeholder: 'Mínimo 8 caracteres, com letras e números' }), s2 = h('input', { type: 'password', autocomplete: 'new-password' });

  paginaAcesso(h('main', { class: 'entrada painel' }, h('h1', {}, 'Criar conta'),

}

    h('nav', { 'aria-label': 'Menu principal' }, Object.entries(grupos).map(([g, itens]) => [h('div', { class: 'grupo' }, g),

    h('div', { class: 'eu', title: p.email }, h('div', { class: 'avatar', style: { background: 'var(--pessoa-a)' } }, iniciais(p.nome)), h('div', {}, h('b', {}, p.nome), h('span', {}, p.email))));
  const trilha = h('div', { class: 'trilha' }), conteudo = h('div', { class: 'conteudo', id: 'conteudo' });

  const main = h('div', { class: 'principal' }, h('div', { class: 'topo' }, h('button', { class: 'btn sec mini menu-btn', type: 'button', 'aria-label': 'Abrir menu', onclick: () => abrirMenu() }, ico('menu')), trilha,
      h('button', { class: 'btn mini pix', type: 'button', title: 'Novo gasto no pix/débito', onclick: () => __m_pages_gastos.formGasto(p, null, depoisDeLancar) }, ico('mais'), h('span', { class: 'txt' }, 'Pix')),
      h('button', { class: 'btn mini', type: 'button', title: 'Nova compra no cartão', onclick: () => __m_pages_faturas.formCompra(p, null, depoisDeLancar) }, ico('mais'), h('span', { class: 'txt' }, 'Cartão')), sair),

  const veu = h('div', { class: 'veu-menu', onclick: () => fecharMenu() });

    h('button', { class: 'aba', type: 'button', 'data-rota': '__mais', onclick: () => abrirMenu() }, ico('menu'), h('span', {}, 'Mais')));
  raiz.append(h('div', { class: 'app' }, nav, main), veu, abas); shell = { nav, trilha, conteudo, abas, veu };
}
function abrirMenu() { if (!shell) return; shell.nav.classList.add('aberto'); shell.veu.classList.add('aberto'); }
function fecharMenu() { if (!shell) return; shell.nav.classList.remove('aberto'); shell.veu.classList.remove('aberto'); }
function rotear() { return rotearInterno().catch(erroFatal); }
function erroFatal(e) { console.error(e); try { toast('Erro: ' + ((e && e.message) || e), true); } catch (_) {} }
async function rotearInterno() {
  const { nome, query } = rotaDoHash();
  if (!estado.perfil) { try { const r = await GET('/api/eu', { semRedirecionar: true }); estado.perfil = r.perfil; } catch (_) {} }
  // sem sessão nesta aba, mas com "manter-me conectado": entra direto, antes de mostrar a tela de login
  if (!estado.perfil && lerManter() && nome !== 'cadastro') { limpar(raiz).append(h('p', { class: 'carregando' }, 'Entrando…')); try { await retomarSilencioso(); } catch (_) {} }

  h('p', {}, 'Abra o arquivo config.js no GitHub e cole o link do App da Web (o que termina em /exec). Depois de salvar, aguarde 1 minuto e recarregue esta página.')));
else rotear();

})();
