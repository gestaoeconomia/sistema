// ---------- leitura do PDF no navegador (pdf.js) ----------
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';

    carregarScript(PDFJS + 'pdf.min.js').then(() => carregarScript(PDFJS + 'pdf.worker.min.js')).then(() => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; return window.pdfjsLib; }),
    new Promise((_, falha) => setTimeout(() => falha(new Error('tempo esgotado ao carregar o leitor de PDF')), 20000))

/** Pede a senha do PDF numa janela. Devolve a senha ou null (cancelou). */

/** Junta os pedaços de texto do pdf.js em linhas (mesma altura), da esquerda para a direita. */
function montarLinhas(itens) {

    .sort((p, q) => q.y - p.y || p.x - q.x);

  for (const it of lst) {
    const l = linhas[linhas.length - 1];
    if (l && Math.abs(l.y - it.y) <= Math.max(2, Math.min(l.a, it.a) * 0.55)) l.itens.push(it); else linhas.push({ y: it.y, a: it.a, itens: [it] });
  }
  return linhas.map(l => { l.itens.sort((p, q) => p.x - q.x); let txt = '', fimX = null;
    for (const it of l.itens) { const gap = fimX == null ? 0 : it.x - fimX; txt += (fimX == null ? '' : gap > it.a * 1.5 ? '   ' : gap > it.a * 0.15 ? ' ' : '') + it.s; fimX = it.x + it.w; }
