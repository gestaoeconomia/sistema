<script>/* pages/historico */
const __m_pages_historico = (() => {
const { h, limpar, ico } = __m_util;
const { GET } = __m_api;
const { cabPagina, tabela } = __m_ui;

async function render(alvo) {
  const busca = h('input', { type: 'search', placeholder: 'Buscar (ação, nome, ID…)' }), lista = h('div', {});
