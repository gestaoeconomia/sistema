<script>/* pages/conferencia — V1.2 (do SIG: "Qualidade dos dados") */
const __m_pages_conferencia = (() => {
const { h, limpar, ico } = __m_util;
const { GET, POST, estado } = __m_api;
const { cabPagina, toast } = __m_ui;
async function render(alvo, { ir }) {
  const corpo = h('div', {});
  alvo.append(cabPagina('Conferência dos dados', 'O que costuma ser erro de digitação ou esquecimento nos seus lançamentos. Nada muda sozinho: toque no item para abrir a tela onde se corrige.',
    h('button', { class: 'btn sec', type: 'button', onclick: () => carregar() }, ico('repetir'), 'Conferir de novo')), corpo);
  async function carregar() {
    limpar(corpo).append(h('p', { class: 'carregando' }, 'Conferindo…'));
    const r = await GET('/api/conferencia');
    limpar(corpo);
    if (!r.grupos.length) corpo.append(h('div', { class: 'aviso ok' }, ico('ok'), ' Tudo certo: nenhum lançamento repetido, sem categoria, com data estranha ou fatura esquecida.'));
    else corpo.append(h('div', { class: 'aviso info' }, ico('info'), ` ${r.total} ${r.total === 1 ? 'ponto para conferir' : 'pontos para conferir'}.`));
    r.grupos.forEach(g => corpo.append(h('div', { class: 'painel conf-grupo' },
      h('div', { class: 'titulo-painel' }, h('div', {}, h('h2', {}, g.titulo, ' ', h('span', { class: 'chip' }, String(g.total))), h('p', { class: 'sub' }, g.explica))),
      h('div', { class: 'conf-itens' }, g.itens.map(x => h('div', { class: 'conf-item' },
        h('button', { type: 'button', class: 'conf-abrir', onclick: () => { if (x.query && x.query.mes) estado.mes = x.query.mes; ir(x.rota, x.query); } }, h('b', {}, x.titulo), h('span', { class: 'dica' }, x.texto)),
        x.ignoravel ? h('button', { type: 'button', class: 'btn sec mini', title: 'Esconder este item', onclick: async ev => {
          try { await POST('/api/conferencia/ok', { chave: x.chave }); ev.target.closest('.conf-item').remove(); toast('Marcado como “não é erro”.'); } catch (e) { toast(e.message, true); } } }, 'Não é erro') : null))),
      g.total > g.itens.length ? h('p', { class: 'dica' }, `Mostrando ${g.itens.length} de ${g.total}.`) : null)));
    if (r.ignorados) corpo.append(h('p', { class: 'dica', style: { textAlign: 'center' } }, `${r.ignorados} ${r.ignorados === 1 ? 'item marcado' : 'itens marcados'} como “não é erro”. `,
      h('a', { href: '#', onclick: async e => { e.preventDefault(); try { await POST('/api/conferencia/ok', { limpar: true }); toast('Voltaram a aparecer.'); carregar(); } catch (er) { toast(er.message, true); } } }, 'Mostrar de novo')));
  }
  await carregar();
}
return { render };
})();
</script>
