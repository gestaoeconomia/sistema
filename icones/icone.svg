<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Gestão Financeira — "Casa em alta": a casa cujo telhado vira uma seta subindo, com a moeda na janela -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16697A"/><stop offset=".55" stop-color="#0E4D5B"/><stop offset="1" stop-color="#06252D"/>
    </linearGradient>
    <radialGradient id="brilho" cx=".85" cy=".1" r=".7">
      <stop offset="0" stop-color="#F28C38" stop-opacity=".38"/><stop offset="1" stop-color="#F28C38" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seta" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#F07F22"/><stop offset="1" stop-color="#FFB06A"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.6" stdDeviation="2" flood-color="#021418" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#fundo)"/>
  <rect width="1024" height="1024" fill="url(#brilho)"/>
  <g transform="translate(53.0 62.0) scale(9.0)" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#sombra)">
    <path d="M18 84 V50 L46 26 L60 40" stroke="#FFFFFF"/>
    <path d="M18 84 H74 V56" stroke="#FFFFFF"/>
    <path d="M60 40 L84 16" stroke="url(#seta)"/>
    <path d="M66 16 H84 V34" stroke="url(#seta)"/>
    <circle cx="46" cy="62" r="8" fill="url(#seta)" stroke="none"/>
  </g>
</svg>
